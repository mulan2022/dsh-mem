# 聊天空间的 section 定义
#
# 这里定义"聊天记忆都整理哪些东西"。用户可以直接改这个文件 —— 换模板不算改代码。
# resident: true 的 section 会**常驻注入**每一次会话（体积要小）；
# resident: false 的只在检索命中时被读到。
#
# ⚠️ 正文是**直接注入给 AI 的记忆**，不是给人看的报告：只写事实，
# 不要写"这条置信度偏低""先放这里观察"这类**对记忆的评论** —— 那会原样进上下文。
# 需要留来源就写成 HTML 注释（`<!-- 来源 [^12] -->`），注入前会被剥掉。
#
# `window` 是**按月滚动的声明**（可选）：
#   current-month  「本月」——只该有当前这个月的小节，更早的由**宿主代码**整块搬走
#   month-archive  「早期月份」——滚动落点
# 判据是"今天几号 vs 小节标题里的月份"，确定得很，所以归**代码**管；
# agent 只负责把小节标题写成 `## YYYY-MM…`（它唯一需要保证的格式）。

space: chat
description: 关于"你"的记忆：个人背景、工作、当前状态、偏好，以及"该怎么记住你"。

sections:
  - name: 个人背景
    file: sections/personal.md
    resident: true
    order: 10
    hint: 身份、经历、居住、人格、沟通风格、生活方式、家人与宠物

  - name: 工作背景
    file: sections/work.md
    resident: true
    order: 20
    hint: 职业现状、转型方向、个人项目与外部协作、职业抱负

  - name: 本月
    file: sections/this-month.md
    resident: true
    order: 30
    window: current-month
    hint: 这个月在推进的事、进度与卡点；小节标题必须以 `## YYYY-MM` 开头（跨月滚动靠它判断）

  - name: 早期月份
    file: sections/earlier-months.md
    resident: true
    order: 40
    window: month-archive
    hint: 往月归档、按月分小节；更早的月份由宿主代码从「本月」滚进来，不用手搬

  - name: 品味与偏好
    file: sections/taste.md
    resident: true
    order: 50
    hint: 审美、学习风格、兴趣、消费与工具取向、对 AI 的态度、论证与做事风格

  - name: 记忆提示
    file: sections/memory-tips.md
    resident: true
    order: 60
    hint: 关于"怎么记住我"的元信息：准确性期待、注入机制、连续性优先
